        run: |
          curl -s -X POST \
            https://engageengine-prospector.robertlbutt.workers.dev/api/pipeline \
            -H "X-Cron-Secret: ${{ secrets.PROSPECTOR_CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 30 \
            --fail \
            | cat
